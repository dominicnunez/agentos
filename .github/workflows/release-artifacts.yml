name: release-artifacts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # 2026-08-03
        with:
          python-version-file: .python-version
      - name: Build and verify release-candidate artifacts
        env:
          GOCACHE: ${{ runner.temp }}/agentos-gocache-a
          GOMODCACHE: ${{ runner.temp }}/agentos-gomodcache-a
        run: |
          python3 scripts/build-release.py --output "$RUNNER_TEMP/agentos-release-a"
          (cd "$RUNNER_TEMP/agentos-release-a" && sha256sum --check SHA256SUMS)

      - name: Verify byte reproducibility
        env:
          GOCACHE: ${{ runner.temp }}/agentos-gocache-b
          GOMODCACHE: ${{ runner.temp }}/agentos-gomodcache-b
        run: |
          python3 scripts/build-release.py --output "$RUNNER_TEMP/agentos-release-b"
          diff --recursive --no-dereference \
            "$RUNNER_TEMP/agentos-release-a" \
            "$RUNNER_TEMP/agentos-release-b"

      - name: Verify packaged licenses and corresponding source
        env:
          GOCACHE: ${{ runner.temp }}/agentos-source-gocache
          GOMODCACHE: ${{ runner.temp }}/agentos-source-gomodcache
        run: |
          version=$(tr -d '\r\n' < VERSION)
          for target in linux_amd64 linux_arm64; do
            archive="$RUNNER_TEMP/agentos-release-a/agentos_${version}_${target}.tar.gz"
            root="agentos_${version}_${target}"
            listing=$(tar --list --gzip --file "$archive")
            grep --fixed-strings --line-regexp "$root/LICENSE" <<<"$listing"
            grep --fixed-strings --line-regexp "$root/SOURCE.md" <<<"$listing"
            grep --fixed-strings --line-regexp \
              "$root/THIRD_PARTY_LICENSES/manifest.json" <<<"$listing"
          done
          source_directory="$RUNNER_TEMP/agentos-source"
          source_root="$source_directory/agentos_${version}_source"
          mkdir "$source_directory"
          tar --extract --gzip \
            --file "$RUNNER_TEMP/agentos-release-a/agentos_${version}_source.tar.gz" \
            --directory "$source_directory"
          test -f "$source_root/LICENSE"
          test -f "$source_root/SOURCE.md"
          test -f "$source_root/vendor/modules.txt"
          cd "$source_root"
          GOPROXY=off GOSUMDB=off go test -mod=vendor ./...

      - name: Smoke-test packaged Linux amd64 binaries
        run: |
          version=$(tr -d '\r\n' < VERSION)
          package_directory="$RUNNER_TEMP/agentos-package"
          package_root="$package_directory/agentos_${version}_linux_amd64"
          archive="$RUNNER_TEMP/agentos-release-a/agentos_${version}_linux_amd64.tar.gz"
          mkdir "$package_directory"
          tar --extract --gzip --file "$archive" --directory "$package_directory"
          test "$("$package_root/agentos" --version)" = "$version"
          test "$("$package_root/agentos-recovery" --version)" = "$version"
          if "$package_root/agentos" doctor >"$RUNNER_TEMP/agentos-doctor.log" 2>&1; then
            echo "packaged doctor unexpectedly accepted an uninitialized machine"
            exit 1
          fi
          grep --fixed-strings "No valid installation" "$RUNNER_TEMP/agentos-doctor.log"
