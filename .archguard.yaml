version: 1

packages:
  root: github.com/dominicnunez/agentos
  patterns:
    - ./internal/...

modules:
  - name: app
    path: internal/app
  - name: assignment
    path: internal/assignment
  - name: artifacts
    path: internal/artifacts
  - name: approvals
    path: internal/approvals
  - name: audit
    path: internal/audit
  - name: bootstrap
    path: internal/bootstrap
  - name: authority
    path: internal/authority
  - name: completion
    path: internal/completion
  - name: core
    path: internal/core
  - name: dashboard
    path: internal/dashboard
  - name: effects
    path: internal/effects
  - name: effectstatus
    path: internal/effectstatus
  - name: events
    path: internal/events
  - name: execution
    path: internal/execution
  - name: fileguard
    path: internal/fileguard
  - name: gateway
    path: internal/gateway
  - name: inference
    path: internal/inference
  - name: inspection
    path: internal/inspection
  - name: intake
    path: internal/intake
  - name: knowledge
    path: internal/knowledge
  - name: lab
    path: internal/lab
  - name: modelid
    path: internal/modelid
  - name: modeloutput
    path: internal/modeloutput
  - name: planning
    path: internal/planning
  - name: ledger
    path: internal/ledger
  - name: projections
    path: internal/projections
  - name: replay
    path: internal/replay
  - name: secrets
    path: internal/secrets
  - name: telemetry
    path: internal/telemetry
  - name: trustconfig
    path: internal/trustconfig
  - name: workflow
    path: internal/workflow

policy:
  default: deny
  allow:
    - name: same-module
      from:
        module: "*"
      to:
        same_module: true

    - name: application-orchestration
      from:
        module: app
      to:
        modules: [assignment, completion, core, events, execution, inference, inspection, lab, planning, projections, replay, telemetry, workflow]

    - name: assignment-domain
      from:
        module: assignment
      to:
        module: core

    - name: artifact-domain
      from:
        module: artifacts
      to:
        module: core

    - name: approval-domain
      from:
        module: approvals
      to:
        modules: [core, events]

    - name: audit-domain
      from:
        module: audit
      to:
        modules: [core, events]

    - name: authority-domain
      from:
        module: authority
      to:
        module: core

    - name: completion-domain
      from:
        module: completion
      to:
        modules: [core, events]

    - name: execution-domain
      from:
        module: execution
      to:
        modules: [core, events, modelid]

    - name: bootstrap-model-identifiers
      from:
        module: bootstrap
      to:
        modules: [fileguard, inference, modelid]

    - name: sealed-file-mutation
      from:
        module: secrets
      to:
        module: fileguard

    - name: telemetry-projection
      from:
        module: telemetry
      to:
        modules: [core, events]

    - name: effects-domain
      from:
        module: effects
      to:
        modules: [approvals, authority, core]

    - name: effect-status-boundary
      from:
        module: effectstatus
      to:
        modules: [core, effects, trustconfig]

    - name: operator-boundary
      from:
        module: gateway
      to:
        modules: [approvals, artifacts, core, intake, trustconfig]

    - name: operator-intake
      from:
        module: intake
      to:
        modules: [app, core, events, inference, inspection, modeloutput, replay]

    - name: knowledge-domain
      from:
        module: knowledge
      to:
        modules: [core, events]

    - name: lab-composition
      from:
        module: lab
      to:
        modules: [core, events, projections]

    - name: lab-test-adapter
      from:
        module: lab
        tests: true
      to:
        modules: [app, execution, ledger]

    - name: event-persistence
      from:
        module: ledger
      to:
        modules: [approvals, authority, core, events, inference]

    - name: inference-provider-boundary
      from:
        module: inference
      to:
        modules: [events, execution]

    - name: governance-inspection
      from:
        module: inspection
      to:
        modules: [audit, core, events, projections]

    - name: event-contract-domain
      from:
        module: events
      to:
        module: core

    - name: projection-domain
      from:
        module: projections
      to:
        modules: [core, events]

    - name: deterministic-incident-replay
      from:
        module: replay
      to:
        module: events

    - name: planning-domain
      from:
        module: planning
      to:
        modules: [core, events, modeloutput]

    - name: workflow-domain
      from:
        module: workflow
      to:
        module: core

    - name: application-test-adapter
      from:
        module: app
        tests: true
      to:
        module: ledger

    - name: approvals-test-adapters
      from:
        module: approvals
        tests: true
      to:
        modules: [effects, events, ledger]

    - name: effects-test-adapter
      from:
        module: effects
        tests: true
      to:
        module: ledger

    - name: gateway-test-adapter
      from:
        module: gateway
        tests: true
      to:
        modules: [app, approvals, effects, events, execution, ledger]

    - name: intake-test-adapter
      from:
        module: intake
        tests: true
      to:
        modules: [execution, ledger]

    - name: knowledge-test-adapter
      from:
        module: knowledge
        tests: true
      to:
        module: ledger

    - name: ledger-recovery-test-adapter
      from:
        module: ledger
        tests: true
      to:
        modules: [app, execution]

    - name: projections-test-adapter
      from:
        module: projections
        tests: true
      to:
        module: ledger

analysis:
  include_tests: true
  profiles:
    - modular-monolith
  table_owners:
    - module: ledger
      tables: [consumed_approvals, events, inbox, inference_policies, inference_reservations, records]
