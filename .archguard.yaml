version: 1

packages:
  root: github.com/dominicnunez/agentos
  patterns:
    - ./internal/...

modules:
  - name: app
    path: internal/app
  - name: approvals
    path: internal/approvals
  - name: audit
    path: internal/audit
  - name: authority
    path: internal/authority
  - name: completion
    path: internal/completion
  - name: core
    path: internal/core
  - name: effects
    path: internal/effects
  - name: events
    path: internal/events
  - name: execution
    path: internal/execution
  - name: gateway
    path: internal/gateway
  - name: inference
    path: internal/inference
  - name: knowledge
    path: internal/knowledge
  - name: ledger
    path: internal/ledger
  - name: projections
    path: internal/projections
  - name: secrets
    path: internal/secrets
  - name: telemetry
    path: internal/telemetry
  - name: workflow
    path: internal/workflow

policy:
  default: deny
  allow:
    - name: same-module
      from:
        module: "*"
      to:
        same_module: true

    - name: application-orchestration
      from:
        module: app
      to:
        modules: [completion, core, events, execution, projections, telemetry, workflow]

    - name: approval-domain
      from:
        module: approvals
      to:
        module: core

    - name: audit-events
      from:
        module: audit
      to:
        module: events

    - name: authority-domain
      from:
        module: authority
      to:
        module: core

    - name: completion-domain
      from:
        module: completion
      to:
        module: core

    - name: execution-domain
      from:
        module: execution
      to:
        modules: [core, events]

    - name: telemetry-projection
      from:
        module: telemetry
      to:
        modules: [core, events]

    - name: effects-domain
      from:
        module: effects
      to:
        modules: [approvals, authority, core]

    - name: operator-boundary
      from:
        module: gateway
      to:
        modules: [app, core, events]

    - name: knowledge-domain
      from:
        module: knowledge
      to:
        module: core

    - name: event-persistence
      from:
        module: ledger
      to:
        modules: [approvals, authority, core, events]

    - name: projection-domain
      from:
        module: projections
      to:
        modules: [core, events]

    - name: workflow-domain
      from:
        module: workflow
      to:
        module: core

    - name: application-test-adapter
      from:
        module: app
        tests: true
      to:
        module: ledger

    - name: approvals-test-adapters
      from:
        module: approvals
        tests: true
      to:
        modules: [effects, events, ledger]

    - name: effects-test-adapter
      from:
        module: effects
        tests: true
      to:
        module: ledger

    - name: gateway-test-adapter
      from:
        module: gateway
        tests: true
      to:
        modules: [approvals, effects, ledger]

    - name: knowledge-test-adapter
      from:
        module: knowledge
        tests: true
      to:
        module: ledger

    - name: projections-test-adapter
      from:
        module: projections
        tests: true
      to:
        module: ledger

analysis:
  include_tests: true
  profiles:
    - modular-monolith
  table_owners:
    - module: ledger
      tables: [consumed_approvals, events, inbox, records]
