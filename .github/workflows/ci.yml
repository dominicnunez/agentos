name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      - name: Formatting
        run: test -z "$(gofmt -l .)"

      - name: Module consistency
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Version contract
        run: |
          mkdir -p work
          version=$(tr -d '\r\n' < VERSION)
          go build -ldflags "-X main.version=$version" -o work/agentos-version ./cmd/agentos
          test "$(./work/agentos-version --version)" = "$version"

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 run

      - name: Race-tested unit tests
        run: go test -race ./...

      - name: Bounded operator-boundary fuzzing
        run: go test ./internal/gateway -run=^$ -fuzz=FuzzOperatorWorkContent -fuzztime=10s -parallel=4

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: A2A Agent and human intake interoperability
        env:
          AGENTOS_DB: work/a2a-interop.db
          AGENTOS_A2A_ACTORS_FILE: scripts/testdata/a2a-actors-ci.json
          AGENTOS_HUMAN_ACTORS_FILE: scripts/testdata/human-actors-ci.json
          AGENTOS_A2A_AGENT_TOKEN: ci-a2a-agent-token-000000000000001
          AGENTOS_HUMAN_OPERATOR_TOKEN: ci-human-operator-token-00000000001
          AGENTOS_PUBLIC_URL: http://127.0.0.1:8080
        run: |
          go build -o work/agentos ./cmd/agentos
          ./work/agentos >work/a2a-interop.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/.well-known/agent-card.json >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat work/a2a-interop.log
              exit 1
            fi
            sleep 1
          done
          python3 scripts/verify-a2a-interop.py \
            --url http://127.0.0.1:8080 \
            --token "$AGENTOS_A2A_AGENT_TOKEN"
          python3 scripts/verify-human-intake.py \
            --url http://127.0.0.1:8080 \
            --token "$AGENTOS_HUMAN_OPERATOR_TOKEN"

      - name: Disposable backup and restart pilot
        env:
          AGENTOS_PILOT_AGENT_TOKEN: pilot-agent-token-00000000000000001
          AGENTOS_PILOT_READER_TOKEN: pilot-reader-token-0000000000000001
          AGENTOS_PILOT_REVOKED_TOKEN: pilot-revoked-token-000000000000001
          AGENTOS_PILOT_EXPIRED_TOKEN: pilot-expired-token-000000000000001
          AGENTOS_PILOT_HUMAN_TOKEN: pilot-human-token-00000000000000001
        run: |
          mkdir -p work/pilot
          go build -o work/agentos ./cmd/agentos
          go build -o work/agentos-recovery ./cmd/agentos-recovery
          pilot_pid=""
          stop_pilot() {
            if [ -n "$pilot_pid" ]; then
              kill -TERM "$pilot_pid" 2>/dev/null || true
              wait "$pilot_pid" 2>/dev/null || true
              pilot_pid=""
            fi
          }
          start_pilot() {
            AGENTOS_DB="$1" \
            AGENTOS_A2A_ACTORS_FILE="$2" \
            AGENTOS_HUMAN_ACTORS_FILE=scripts/testdata/pilot-human.json \
            AGENTOS_LISTEN_ADDR=127.0.0.1:8081 \
            AGENTOS_PUBLIC_URL=http://127.0.0.1:8081 \
            ./work/agentos >work/pilot/server.log 2>&1 &
            pilot_pid=$!
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8081/.well-known/agent-card.json >/dev/null; then
                return
              fi
              if [ "$attempt" -eq 30 ]; then
                cat work/pilot/server.log
                exit 1
              fi
              sleep 1
            done
          }
          trap stop_pilot EXIT
          start_pilot work/pilot/live.db scripts/testdata/pilot-a2a-seed.json
          python3 scripts/verify-loopback-pilot.py seed \
            --url http://127.0.0.1:8081 \
            --state work/pilot/state.json \
            --agent-token "$AGENTOS_PILOT_AGENT_TOKEN" \
            --reader-token "$AGENTOS_PILOT_READER_TOKEN" \
            --revoked-token "$AGENTOS_PILOT_REVOKED_TOKEN" \
            --expired-token "$AGENTOS_PILOT_EXPIRED_TOKEN" \
            --human-token "$AGENTOS_PILOT_HUMAN_TOKEN"
          ./work/agentos-recovery backup \
            --database work/pilot/live.db \
            --output work/pilot/backup.db >work/pilot/backup.json
          ./work/agentos-recovery verify \
            --database work/pilot/backup.db >work/pilot/verified.json
          stop_pilot
          ./work/agentos-recovery restore \
            --backup work/pilot/backup.db \
            --output work/pilot/restored.db >work/pilot/restored.json
          start_pilot work/pilot/restored.db scripts/testdata/pilot-a2a-restart.json
          python3 scripts/verify-loopback-pilot.py recover \
            --url http://127.0.0.1:8081 \
            --state work/pilot/state.json \
            --agent-token "$AGENTOS_PILOT_AGENT_TOKEN" \
            --reader-token "$AGENTOS_PILOT_READER_TOKEN" \
            --revoked-token "$AGENTOS_PILOT_REVOKED_TOKEN" \
            --expired-token "$AGENTOS_PILOT_EXPIRED_TOKEN" \
            --human-token "$AGENTOS_PILOT_HUMAN_TOKEN"
          stop_pilot

      - name: Architecture boundaries
        run: go tool archguard check --include-tests --profile modular-monolith

      - name: Gallow advisory SARIF
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          go tool gallow audit --base "origin/${{ github.base_ref }}" --format sarif > gallow.sarif

      - name: Upload Gallow SARIF
        if: github.event_name == 'pull_request' && hashFiles('gallow.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gallow.sarif
          category: gallow
