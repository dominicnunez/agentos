name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Dashboard dependency and type checks
        working-directory: web/dashboard
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm peers check
          pnpm audit --audit-level high
          pnpm check
          pnpm test

      - name: Reproduce embedded dashboard
        working-directory: web/dashboard
        run: |
          pnpm build
          dashboard_status=$(git status --porcelain=v1 --untracked-files=all -- ../../internal/dashboard/dist)
          if [ -n "$dashboard_status" ]; then
            printf '%s\n' "$dashboard_status"
            exit 1
          fi
      - run: go mod download

      - name: Formatting
        run: test -z "$(gofmt -l .)"

      - name: Module consistency
        run: go mod tidy -diff

      - name: Controlled AIMS documented information
        run: |
          test -x .githooks/pre-commit
          python3 scripts/verify_aims_documents.py
          python3 -m unittest scripts/test_verify_aims_documents.py
          python3 -m unittest scripts/test_build_aims_assessment_bundle.py
          mkdir -p work/aims-first work/aims-second
          assessment_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          baseline_before_commit() {
            parent_line=$(git rev-list --parents -n 1 "$1")
            set -- $parent_line
            shift
            if [ "$#" -eq 0 ]; then
              echo "AIMS history verification requires a commit with at least one parent." >&2
              return 1
            fi
            if [ "$#" -eq 1 ]; then
              printf '%s\n' "$1"
            else
              git merge-base --octopus "$@"
            fi
          }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            history_baseline=$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            history_baseline=$(baseline_before_commit "${GITHUB_SHA}")
          else
            history_baseline="${{ github.event.before }}"
            if [ "$history_baseline" = "0000000000000000000000000000000000000000" ]; then
              history_baseline=$(git merge-base "origin/${{ github.event.repository.default_branch }}" "${GITHUB_SHA}")
              if [ "$history_baseline" = "${GITHUB_SHA}" ]; then
                history_baseline=$(baseline_before_commit "${GITHUB_SHA}")
              fi
            fi
          fi
          python3 scripts/build_aims_assessment_bundle.py --commit "${GITHUB_SHA}" --assessment-at "$assessment_at" --history-baseline "$history_baseline" --output work/aims-first/agentos-aims-assessment.tar.gz
          python3 scripts/build_aims_assessment_bundle.py --commit "${GITHUB_SHA}" --assessment-at "$assessment_at" --history-baseline "$history_baseline" --output work/aims-second/agentos-aims-assessment.tar.gz
          cmp work/aims-first/agentos-aims-assessment.tar.gz work/aims-second/agentos-aims-assessment.tar.gz

      - name: Build
        run: go build ./...

      - name: Version contract
        run: |
          mkdir -p work
          version=$(tr -d '\r\n' < VERSION)
          go build -ldflags "-X main.version=$version" -o work/agentos-version ./cmd/agentos
          go build -ldflags "-X main.version=$version" -o work/agentos-recovery-version ./cmd/agentos-recovery
          test "$(./work/agentos-version --version)" = "$version"
          test "$(./work/agentos-recovery-version --version)" = "$version"

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 run

      - name: Race-tested unit tests
        run: go test -race ./...

      - name: Bounded operator-boundary fuzzing
        run: go test ./internal/gateway -run=^$ -fuzz=FuzzOperatorWorkContent -fuzztime=10s -parallel=4

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Linux binary boundary
        run: |
          version=$(tr -d '\r\n' < VERSION)
          go build -ldflags "-X main.version=$version" -o work/agentos ./cmd/agentos
          test "$(./work/agentos --version)" = "$version"
          if ./work/agentos doctor >work/doctor.log 2>&1; then
            echo "doctor unexpectedly accepted an uninitialized machine"
            exit 1
          fi
          grep --fixed-strings "No valid installation" work/doctor.log

      - name: Architecture boundaries
        run: go tool archguard check --include-tests --profile modular-monolith

      - name: Gallow advisory SARIF
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          go tool gallow audit --base "origin/${{ github.base_ref }}" --format sarif > gallow.sarif

      - name: Upload Gallow SARIF
        if: github.event_name == 'pull_request' && hashFiles('gallow.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: gallow.sarif
          category: gallow
