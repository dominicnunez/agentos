name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Hermes v0.20.0 A2A client
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 3c27eb6234bf91b8ceee9e9071591b31e9b148cb
          path: work/hermes-v0.20.0
          sparse-checkout: plugins/platforms/a2a
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      - name: Formatting
        run: test -z "$(gofmt -l .)"

      - name: Module consistency
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 run

      - name: Race-tested unit tests
        run: go test -race ./...

      - name: Hermes v0.20.0 and human intake interoperability
        env:
          AGENTOS_DB: work/hermes-interop.db
          AGENTOS_OPERATOR_TOKEN: hermes-interop-token
          AGENTOS_HUMAN_TOKEN: human-interop-token
          AGENTOS_ORGANIZATION_ID: hermes-interop-org
          AGENTOS_PUBLIC_URL: http://127.0.0.1:8080
        run: |
          go build -o work/agentos ./cmd/agentos
          ./work/agentos >work/hermes-interop.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/.well-known/agent-card.json >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat work/hermes-interop.log
              exit 1
            fi
            sleep 1
          done
          python3 scripts/verify-hermes-v020-interop.py \
            --hermes-root work/hermes-v0.20.0 \
            --url http://127.0.0.1:8080 \
            --token "$AGENTOS_OPERATOR_TOKEN"
          python3 scripts/verify-human-intake.py \
            --url http://127.0.0.1:8080 \
            --token "$AGENTOS_HUMAN_TOKEN"

      - name: Architecture boundaries
        run: go tool archguard check --include-tests --profile modular-monolith

      - name: Gallow advisory SARIF
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          go tool gallow audit --base "origin/${{ github.base_ref }}" --format sarif > gallow.sarif

      - name: Upload Gallow SARIF
        if: github.event_name == 'pull_request' && hashFiles('gallow.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gallow.sarif
          category: gallow
